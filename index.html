    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #0a0e14; --panel: #12161f; --panel2: #1a1f2b; --hover: #252b3a;
            --ink: #e6e8eb; --muted: #9ca3af; --faint: #6b7280; --line: #2d3548;
            --brand: #8b5cf6; --brand2: #a78bfa; --brand-ink: #ffffff; --glow: rgba(139,92,246,.25);
            --ok: #00ff88; --okbg: rgba(0,255,136,.12); --warn: #ffaa00; --warnbg: rgba(255,170,0,.14);
            --bad: #ff4466; --badbg: rgba(255,68,102,.14); --info: #a78bfa; --infobg: rgba(139,92,246,.16);
            --shadow: 0 2px 10px rgba(0,0,0,.45);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
        a { color: var(--brand2); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { font-family: inherit; font-size: 13px; cursor: pointer; }
        .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 7px 13px; border-radius: 7px; transition: all .15s ease; }
        .btn:hover { border-color: var(--brand); color: #fff; }
        .btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: var(--brand-ink); border-color: transparent; box-shadow: 0 0 0 rgba(139,92,246,0); }
        .btn.primary:hover { box-shadow: 0 0 14px var(--glow); }
        .btn.danger { color: var(--bad); border-color: rgba(255,68,102,.4); background: rgba(255,68,102,.08); }
        .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
        input, select, textarea { font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--ink); width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--glow); }
        textarea { min-height: 62px; resize: vertical; }
        label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
        /* Layout */
        #loading, #signin { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
        #signin img.logo-hero { width: 190px; max-width: 60vw; margin-bottom: 6px; }
        #app { display: none; grid-template-columns: 236px 1fr; min-height: 100vh; }
        #sidebar { background: var(--panel); color: var(--muted); padding: 22px 12px; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); }
        #sidebar .brand { padding: 2px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
        #sidebar .brand img.logo-img { width: 100%; max-width: 158px; display: block; }
        #sidebar .brand .brand-sub { display: block; font-weight: 700; font-size: 12px; margin-top: 10px; letter-spacing: .3px; background: linear-gradient(135deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        #sidebar nav a { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 9px 11px; border-radius: 8px; margin-bottom: 2px; font-weight: 600; transition: all .15s ease; }
        #sidebar nav a:hover { background: var(--hover); color: #fff; text-decoration: none; }
        #sidebar nav a.active { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; box-shadow: 0 0 14px var(--glow); }
        #sidebar .who { position: absolute; bottom: 16px; left: 12px; right: 12px; font-size: 11px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
        #sidebar .who a { color: var(--brand2); }
        main { padding: 22px 26px 60px; overflow: auto; }
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .page-head h1 { font-size: 20px; margin: 0; }
        .page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .toolbar .search { flex: 1; min-width: 200px; max-width: 340px; }
        /* Cards / tiles */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
        .tile .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
        .tile .v { font-size: 26px; font-weight: 800; margin-top: 4px; color: #fff; }
        .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
        .panel h2 { font-size: 14px; margin: 0; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); }
        .panel .body { padding: 14px 16px; }
        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: var(--panel2); position: sticky; top: 0; }
        tbody tr:hover { background: var(--panel2); }
        .table-wrap { overflow-x: auto; }
        .filter-row th { padding: 5px 8px; background: var(--panel); }
        .filter-row input { padding: 4px 7px; font-size: 12px; }
        /* Badges */
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .b-ok { background: var(--okbg); color: var(--ok); }
        .b-warn { background: var(--warnbg); color: var(--warn); }
        .b-bad { background: var(--badbg); color: var(--bad); }
        .b-info { background: var(--infobg); color: var(--info); }
        .b-mut { background: var(--hover); color: var(--muted); }
        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; backdrop-filter: blur(2px); }
        .modal-bg.open { display: flex; }
        .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 720px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
        .modal.wide { max-width: 940px; }
        .modal .m-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); }
        .modal .m-head h3 { margin: 0; font-size: 16px; }
        .modal .m-head .x { border: none; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
        .modal .m-body { padding: 18px; }
        .modal .m-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .field { margin-bottom: 12px; }
        .fs { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
        .fs > legend { font-size: 12px; font-weight: 700; color: var(--brand2); padding: 0 6px; text-transform: uppercase; letter-spacing: .4px; }
        /* People picker */
        .people-results { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 210px; overflow: auto; background: var(--panel2); }
        .people-results .p { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
        .people-results .p:hover { background: var(--hover); }
        .people-results .p small { color: var(--muted); display: block; }
        /* Toast */
        #toast { position: fixed; bottom: 22px; right: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
        #toast .t { background: var(--panel2); border: 1px solid var(--line); color: #fff; padding: 11px 16px; border-radius: 9px; box-shadow: var(--shadow); font-size: 13px; max-width: 360px; }
        #toast .t.ok { border-color: var(--ok); } #toast .t.bad { border-color: var(--bad); }
        .muted { color: var(--muted); } .right { text-align: right; } .nowrap { white-space: nowrap; }
        .empty { text-align: center; color: var(--muted); padding: 30px; }
        .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .views-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; margin-bottom: 8px; }
        .views-bar .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
        .views-bar .chip:hover { border-color: var(--brand); }
        @media (max-width: 760px) { #app { grid-template-columns: 1fr; } #sidebar { position: static; height: auto; } .grid2, .grid3 { grid-template-columns: 1fr; } }
    </style>
</head>

    <script>
    /* ============================================================================
       IT Asset Inventory — single-file app, SharePoint (Graph) backed.
       Same architecture as NetInventory: MSAL auth, SharePointDataStore over Graph,
       localStorage is a 5-min cache ONLY. Data of record lives in SharePoint lists.
       ============================================================================ */

    const CONFIG = {
        clientId: 'f0bc695d-e675-4aa8-a114-8b7935183c30',   // shared Iris SPA app reg (add this Pages URL as a redirect URI)
        tenantId: 'iristransport.onmicrosoft.com',
        hostname: 'iristransport.sharepoint.com',
        sitePath: 'sites/itsite',                            // resolved to a composite site id at runtime
        pagesUrl: 'https://iris-eli.github.io/itinventory/', // public deploy URL (redirect + QR deep-link base)
        siteId: null,                                        // filled by resolveSiteId()
        listNames: {
            assets: 'ITAssets_Assets',
            assignments: 'ITAssets_Assignments',
            sparing: 'ITAssets_SparingTargets',
            locations: 'ITAssets_Locations',
            disposals: 'ITAssets_Disposals',
            licenses: 'ITAssets_Licenses',
            licenseAssignments: 'ITAssets_LicenseAssignments'
        },
        fieldMappings: {
            assets: {
                assetTag: 'Title', serialNumber: 'SerialNumber', category: 'Category', make: 'Make', model: 'Model',
                status: 'Status', condition: 'Condition', expectReturn: 'ExpectReturn',
                assignedToName: 'AssignedToName', assignedToUpn: 'AssignedToUPN', assignedToAadId: 'AssignedToAADId',
                assignedDate: 'AssignedDate', locationId: 'LocationId', poNumber: 'PONumber', vendor: 'Vendor',
                purchaseDate: 'PurchaseDate', purchaseCost: 'PurchaseCost', depreciationYears: 'DepreciationYears',
                salvageValue: 'SalvageValue', warrantyExpiration: 'WarrantyExpiration', retiredDate: 'RetiredDate',
                disposalMethod: 'DisposalMethod', dataWipeStatus: 'DataWipeStatus', notes: 'Notes'
            },
            assignments: {
                key: 'Title', assetTag: 'AssetTag', personName: 'PersonName', personUpn: 'PersonUPN',
                personAadId: 'PersonAADId', issuedDate: 'IssuedDate', returnedDate: 'ReturnedDate',
                conditionOut: 'ConditionOut', conditionIn: 'ConditionIn', issuedBy: 'IssuedBy', notes: 'Notes'
            },
            sparing: { key: 'Title', category: 'Category', model: 'Model', minQty: 'MinQty', targetQty: 'TargetQty', notes: 'Notes' },
            locations: { locId: 'Title', locType: 'LocType', address: 'Address', notes: 'Notes' },
            disposals: {
                key: 'Title', assetTag: 'AssetTag', serialNumber: 'SerialNumber', retiredDate: 'RetiredDate',
                disposalMethod: 'DisposalMethod', dataWipeStatus: 'DataWipeStatus', dataWipeMethod: 'DataWipeMethod',
                certRef: 'CertRef', disposedBy: 'DisposedBy', notes: 'Notes'
            },
            licenses: {
                product: 'Title', vendor: 'Vendor', licenseType: 'LicenseType', skuPartNumber: 'SkuPartNumber',
                skuId: 'SkuId', totalSeats: 'TotalSeats', assignedSeats: 'AssignedSeats', unitCost: 'UnitCost',
                billingCycle: 'BillingCycle', renewalDate: 'RenewalDate', owner: 'Owner', notes: 'Notes'
            },
            licenseAssignments: {
                key: 'Title', product: 'ProductName', skuPartNumber: 'SkuPartNumber', personName: 'PersonName',
                personUpn: 'PersonUPN', personAadId: 'PersonAADId', assignedDate: 'AssignedDate'
            }
        },
        // Numeric/date columns: '' must become null on write (Graph rejects '' for these types).
        nonTextCols: new Set(['PurchaseCost','SalvageValue','DepreciationYears','MinQty','TargetQty',
            'AssignedDate','PurchaseDate','WarrantyExpiration','RetiredDate','IssuedDate','ReturnedDate',
            'TotalSeats','AssignedSeats','UnitCost','RenewalDate']),
        cacheTimeout: 5 * 60 * 1000
    };

    const STATUSES = ['In Stock','Deployed','In Repair','Spare','Reserved','Retired','Lost','Disposed'];
    const CATEGORIES = ['Laptop','Desktop','Monitor','Phone','Tablet','Dock','Peripheral','Server','Network','Other'];
    const CONDITIONS = ['New','Good','Fair','Poor','Damaged'];
    const LOC_TYPES = ['Office','Storage','Home','Warehouse','Vendor'];
    const DISPOSAL_METHODS = ['Recycle','Return','Destroy','Donate','Sell'];
    const WIPE_STATUSES = ['Wiped','Destroyed','N/A'];
    const LICENSE_TYPES = ['Subscription','Perpetual'];
    const BILLING_CYCLES = ['Monthly','Annual','One-time'];

    /* ------------------------------------------------------------------ MSAL */
    const msalConfig = {
        auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: CONFIG.pagesUrl },
        cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const loginRequest = { scopes: ['Sites.ReadWrite.All', 'User.Read', 'User.ReadBasic.All'] };
    let accessToken = null, currentUser = null;

    (async function initApp() {
        try {
            const resp = await msalInstance.handleRedirectPromise();
            if (resp) { currentUser = resp.account; accessToken = resp.accessToken; msalInstance.setActiveAccount(currentUser); return start(); }
            const accts = msalInstance.getAllAccounts();
            if (accts.length) {
                currentUser = accts[0]; msalInstance.setActiveAccount(currentUser);
                try { const t = await msalInstance.acquireTokenSilent({ ...loginRequest, account: currentUser }); accessToken = t.accessToken; return start(); }
                catch (e) { return showSignIn(); }
            }
            showSignIn();
        } catch (e) { console.error('init', e); showSignIn(); }
    })();

    function showSignIn() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('signin').style.display = 'flex';
        document.getElementById('signinBtn').style.display = 'block';
    }
    function doSignIn() { msalInstance.loginRedirect(loginRequest); }

    async function getToken() {
        try { const t = await msalInstance.acquireTokenSilent({ ...loginRequest, account: currentUser }); accessToken = t.accessToken; return accessToken; }
        catch (e) { msalInstance.acquireTokenRedirect(loginRequest); throw e; }
    }

    async function graphFetch(endpoint, options = {}, retry = true) {
        const url = endpoint.startsWith('http') ? endpoint : `https://graph.microsoft.com/v1.0${endpoint}`;
        const headers = Object.assign({ 'Authorization': `Bearer ${accessToken}` }, options.headers || {});
        if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 && retry) { await getToken(); return graphFetch(endpoint, options, false); }
        if (!res.ok) { const txt = await res.text(); throw new Error(`Graph ${res.status}: ${txt.slice(0, 300)}`); }
        if (res.status === 204) return null;
        const ct = res.headers.get('content-type') || '';
        return ct.includes('json') ? res.json() : res.text();
    }

    async function resolveSiteId() {
        if (CONFIG.siteId) return CONFIG.siteId;
        const cached = localStorage.getItem('itinv_siteId');
        if (cached) { CONFIG.siteId = cached; return cached; }
        const site = await graphFetch(`/sites/${CONFIG.hostname}:/${CONFIG.sitePath}`);
        CONFIG.siteId = site.id; localStorage.setItem('itinv_siteId', site.id);
        return site.id;
    }

    /* --------------------------------------------------- SharePoint data store */
    class SharePointDataStore {
        constructor() { this.cache = {}; this.cacheAt = {}; }
        _list(entity) { return CONFIG.listNames[entity]; }
        _sanitize(fields) {
            const out = {};
            for (const [col, v] of Object.entries(fields)) {
                if (v === '' && CONFIG.nonTextCols.has(col)) { out[col] = null; continue; }
                if (v === '' && col !== 'Title') { out[col] = null; continue; }
                out[col] = v;
            }
            return out;
        }
        mapFromSharePoint(entity, item) {
            const map = CONFIG.fieldMappings[entity], f = item.fields || {};
            const o = { _spItemId: item.id, _modified: item.lastModifiedDateTime, _created: item.createdDateTime,
                        _modifiedBy: (item.lastModifiedBy && item.lastModifiedBy.user && item.lastModifiedBy.user.displayName) || '' };
            for (const [app, col] of Object.entries(map)) o[app] = (f[col] !== undefined && f[col] !== null) ? f[col] : '';
            return o;
        }
        mapToSharePoint(entity, obj) {
            const map = CONFIG.fieldMappings[entity], fields = {};
            for (const [app, col] of Object.entries(map)) { if (obj[app] !== undefined) fields[col] = obj[app]; }
            return this._sanitize(fields);
        }
        async getAll(entity, force = false) {
            if (!force && this.cache[entity] && (Date.now() - this.cacheAt[entity] < CONFIG.cacheTimeout)) return this.cache[entity];
            await resolveSiteId();
            let endpoint = `/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items?expand=fields&$top=5000`;
            const rows = [];
            try {
                while (endpoint) {
                    const data = await graphFetch(endpoint);
                    (data.value || []).forEach(it => rows.push(this.mapFromSharePoint(entity, it)));
                    endpoint = data['@odata.nextLink'] ? data['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '') : null;
                }
            } catch (e) {
                // A not-yet-provisioned list (404) should read as empty, not break the whole page.
                if (/\b404\b|itemNotFound|does not exist|Not Found/i.test(e.message)) {
                    console.warn(`List "${this._list(entity)}" not found — treating as empty. Run sp-create-itinventory.ps1 to add it.`);
                    return [];
                }
                throw e;
            }
            this.cache[entity] = rows; this.cacheAt[entity] = Date.now();
            return rows;
        }
        async add(entity, obj) {
            await resolveSiteId();
            const fields = this.mapToSharePoint(entity, obj);
            const res = await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items`, { method: 'POST', body: JSON.stringify({ fields }) });
            this.clear(entity); return res;
        }
        async update(entity, spItemId, obj) {
            await resolveSiteId();
            const fields = this.mapToSharePoint(entity, obj);
            const res = await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items/${spItemId}/fields`, { method: 'PATCH', body: JSON.stringify(fields) });
            this.clear(entity); return res;
        }
        async remove(entity, spItemId) {
            await resolveSiteId();
            await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items/${spItemId}`, { method: 'DELETE' });
            this.clear(entity);
        }
        clear(entity) { if (entity) { delete this.cache[entity]; } else { this.cache = {}; } }
    }

    async function searchDirectoryPeople(query) {

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function fmtDate(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
    function toDateInput(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toISOString().slice(0, 10); }
    function fromDateInput(v) { return v ? new Date(v + 'T12:00:00Z').toISOString() : ''; }
    function money(v) { const n = Number(v); return isNaN(n) || v === '' || v == null ? '' : n.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }); }
    function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg; document.getElementById('toast').appendChild(t); setTimeout(() => t.remove(), 4200); }
    function statusBadge(s) {
        const map = { 'In Stock': 'b-info', 'Deployed': 'b-ok', 'In Repair': 'b-warn', 'Spare': 'b-info', 'Reserved': 'b-mut', 'Retired': 'b-mut', 'Lost': 'b-bad', 'Disposed': 'b-bad' };
        return `<span class="badge ${map[s] || 'b-mut'}">${esc(s || '—')}</span>`;
    }

    /* ------------------------------------------------------------------- finance */
    function bookValue(asset) {
        const cost = Number(asset.purchaseCost); if (!cost || isNaN(cost)) return null;
        const salvage = Number(asset.salvageValue) || 0;
        const years = Number(asset.depreciationYears) || 0;
        if (!years || !asset.purchaseDate) return cost; // no schedule -> carry at cost
        const ageMs = Date.now() - new Date(asset.purchaseDate).getTime();
        const ageYears = Math.max(0, ageMs / (365.25 * 24 * 3600 * 1000));
        const depreciable = cost - salvage;
        const bv = cost - depreciable * Math.min(ageYears, years) / years;
        return Math.max(salvage, Math.round(bv));
    }

    /* --------------------------------------------- column filters + saved views */
    function enableColumnFilters(table, viewKey) {
        if (!table || table._filtersOn) return; table._filtersOn = true;
        const thead = table.tHead; if (!thead) return;
        const headRow = thead.rows[0]; const cols = headRow.cells.length;
        const fr = thead.insertRow(); fr.className = 'filter-row';
        for (let i = 0; i < cols; i++) {
            const th = document.createElement('th');
            const isActions = /action/i.test(headRow.cells[i].textContent);
            if (!isActions) {
                const inp = document.createElement('input'); inp.placeholder = 'Filter…'; inp.dataset.col = i;
                inp.addEventListener('input', () => applyTableFilters(table));
                th.appendChild(inp);
            }
            fr.appendChild(th);
        }
        table._viewKey = viewKey;
        if (viewKey) renderViewsBar(table, viewKey);
    }
    function applyTableFilters(table) {
        const inputs = [...table.querySelectorAll('.filter-row input')];
        const term = (table._searchTerm || '').toLowerCase();
        [...table.tBodies[0].rows].forEach(r => {
            let show = true;
            inputs.forEach(inp => { const v = inp.value.trim().toLowerCase(); if (v && !(r.cells[+inp.dataset.col]?.textContent || '').toLowerCase().includes(v)) show = false; });
            if (show && term && !r.textContent.toLowerCase().includes(term)) show = false;
            r.style.display = show ? '' : 'none';
        });
    }
    function renderViewsBar(table, viewKey) {
        const wrap = document.createElement('div'); wrap.className = 'views-bar';
        const store = JSON.parse(localStorage.getItem('itinv_views_' + viewKey) || '{}');
        wrap.innerHTML = '<strong>⭐ Views:</strong>';
        Object.keys(store).forEach(name => {
            const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = name;
            chip.onclick = () => { const f = store[name]; [...table.querySelectorAll('.filter-row input')].forEach(inp => { inp.value = f[inp.dataset.col] || ''; }); applyTableFilters(table); };
            const del = document.createElement('span'); del.textContent = ' ✕'; del.style.color = '#b91c1c'; del.style.cursor = 'pointer';
            del.onclick = (e) => { e.stopPropagation(); delete store[name]; localStorage.setItem('itinv_views_' + viewKey, JSON.stringify(store)); wrap.remove(); renderViewsBar(table, viewKey); };
            chip.appendChild(del); wrap.appendChild(chip);
        });
        const save = document.createElement('span'); save.className = 'chip'; save.textContent = '+ Save current';
        save.onclick = () => { const name = prompt('Name this view:'); if (!name) return; const f = {}; [...table.querySelectorAll('.filter-row input')].forEach(inp => { if (inp.value.trim()) f[inp.dataset.col] = inp.value.trim(); }); store[name] = f; localStorage.setItem('itinv_views_' + viewKey, JSON.stringify(store)); wrap.remove(); renderViewsBar(table, viewKey); };
        wrap.appendChild(save);
        table.parentNode.insertBefore(wrap, table);
    }

    async function saveAsset(spItemId) {
        const g = id => document.getElementById(id).value.trim();
        const tag = g('f_assetTag');
        if (!tag) { toast('Asset tag is required.', 'bad'); return; }
        const obj = {
            assetTag: tag, serialNumber: g('f_serial'), category: g('f_category'), make: g('f_make'), model: g('f_model'),
            status: g('f_status'), condition: g('f_condition'), expectReturn: g('f_expect'), locationId: g('f_location'),
            poNumber: g('f_po'), vendor: g('f_vendor'), purchaseDate: fromDateInput(g('f_pdate')),
            purchaseCost: g('f_cost') === '' ? '' : Number(g('f_cost')), depreciationYears: g('f_depyears') === '' ? '' : Number(g('f_depyears')),
            salvageValue: g('f_salvage') === '' ? '' : Number(g('f_salvage')), warrantyExpiration: fromDateInput(g('f_warranty')), notes: g('f_notes')
        };
        try {
            if (spItemId) await store.update('assets', spItemId, obj);
            else {
                const existing = (await store.getAll('assets')).find(x => x.assetTag === tag);
                if (existing) { toast('An asset with that tag already exists.', 'bad'); return; }
                await store.add('assets', obj);
            }
            toast('Asset saved.', 'ok'); closeModal(); router();
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }

    async function deleteAsset(assetTag) {
        const [assets, assignments, disposals] = await Promise.all([store.getAll('assets'), store.getAll('assignments'), store.getAll('disposals')]);
        const a = assets.find(x => x.assetTag === assetTag);
        if (!a) return;
        const asg = assignments.filter(x => x.assetTag === assetTag);
        const dsp = disposals.filter(x => x.assetTag === assetTag);
        const extra = (asg.length || dsp.length) ? `\n\nThis will also remove ${asg.length} custody record(s) and ${dsp.length} disposal record(s) for this asset.` : '';
        if (!confirm(`Delete asset ${assetTag}? This cannot be undone.${extra}`)) return;
        try {
            await store.remove('assets', a._spItemId);
            for (const x of asg) await store.remove('assignments', x._spItemId);
            for (const x of dsp) await store.remove('disposals', x._spItemId);
            toast(`Deleted ${assetTag}${asg.length + dsp.length ? ` + ${asg.length + dsp.length} related record(s)` : ''}.`, 'ok');
            closeModal(); go('#/assets'); router();
        } catch (e) { toast('Delete failed: ' + e.message, 'bad'); }
    }
    async function deleteAssignment(spItemId) {

    async function cleanOrphanAssignments() {
        const [assignments, assets] = await Promise.all([store.getAll('assignments'), store.getAll('assets')]);
        const tags = new Set(assets.map(a => a.assetTag));
        const orphans = assignments.filter(x => x.assetTag && !tags.has(x.assetTag));
        if (!orphans.length) { toast('No orphan custody records.', 'ok'); return; }
        if (!confirm(`Remove ${orphans.length} custody record(s) that point to deleted assets?`)) return;
        let n = 0; for (const x of orphans) { try { await store.remove('assignments', x._spItemId); n++; } catch (e) { } }
        toast(`Removed ${n} orphan record(s).`, 'ok'); router();
    }

    /* -------------------------------------------------------------------- Spares */
    function computeSpareGaps(assets, spares) {
        // on-hand = assets in stock/spare, counted by category (and model when the target names one)
        return spares.map(t => {
            const min = Number(t.minQty) || 0, target = Number(t.targetQty) || 0;
            const onHand = assets.filter(a => ['In Stock', 'Spare'].includes(a.status) && a.category === t.category && (!t.model || a.model === t.model)).length;
            return { category: t.category, model: t.model, min, target, onHand, gap: Math.max(0, min - onHand), _spItemId: t._spItemId };
        });
    }
    async function renderSparesPage(el) {
        const [assets, spares] = await Promise.all([store.getAll('assets'), store.getAll('sparing')]);
        const gaps = computeSpareGaps(assets, spares);
        el.innerHTML = `
        <div class="page-head"><h1>Spares</h1><div class="actions"><button class="btn" onclick="openImportModal('spares')">⬆️ Import</button><button class="btn primary" onclick="openSpareModal()">＋ New target</button></div></div>
        <p class="muted">On-hand counts assets in <em>In Stock</em> or <em>Spare</em> status matching the category (and model, if the target names one).</p>
        <div class="table-wrap panel"><table><thead><tr><th>Category</th><th>Model</th><th class="right">On hand</th><th class="right">Min</th><th class="right">Target</th><th>Status</th><th>Actions</th></tr></thead><tbody>
        ${gaps.map(g => `<tr><td>${esc(g.category)}</td><td>${esc(g.model || '—')}</td><td class="right">${g.onHand}</td><td class="right">${g.min}</td><td class="right">${g.target}</td><td>${g.gap > 0 ? `<span class="badge b-bad">Order ${g.gap}</span>` : (g.onHand < g.target ? '<span class="badge b-warn">Below target</span>' : '<span class="badge b-ok">OK</span>')}</td><td><button class="btn sm" onclick="openSpareModal('${esc(g._spItemId)}')">Edit</button></td></tr>`).join('')}
        </tbody></table></div>
        ${spares.length ? '' : '<div class="empty">No sparing targets yet. Add one to track reorder levels.</div>'}`;
    }

    async function deleteLocation(spItemId) {
        const [locations, assets] = await Promise.all([store.getAll('locations'), store.getAll('assets')]);
        const l = locations.find(x => x._spItemId === spItemId); if (!l) return;
        const using = assets.filter(a => a.locationId === l.locId).length;
        const warn = using ? `\n\n${using} asset(s) still reference this location — they'll show as “unknown location” on Health until you move them.` : '';
        if (!confirm(`Delete location “${l.locId}”?${warn}`)) return;
        try { await store.remove('locations', spItemId); toast('Location deleted.', 'ok'); closeModal(); router(); } catch (e) { toast('Delete failed: ' + e.message, 'bad'); }
    }

    /* ------------------------------------------------------------------ Licenses */
    function licenseMonthlyCost(l, seatsOverride) {
        const cost = Number(l.unitCost) || 0;
        const seats = seatsOverride != null ? seatsOverride : (Number(l.assignedSeats) || Number(l.totalSeats) || 0);
        const factor = l.billingCycle === 'Annual' ? 1 / 12 : (l.billingCycle === 'One-time' ? 0 : 1);
        return cost * seats * factor;
    }
    // How many per-person assignment rows exist for this license (the live "who holds it" count).
    function licenseTracked(l, licenseAssignments) {
        return licenseAssignments.filter(x => (l.skuPartNumber && x.skuPartNumber === l.skuPartNumber) || (l.product && x.product === l.product)).length;
    }
    // Effective assigned-seat count shown across the app: prefer the live per-person tally when we
    // track people (so removing a person's license frees a seat everywhere); else the stored value.
    function licenseAssigned(l, licenseAssignments) {
        const tracked = licenseTracked(l, licenseAssignments);
        const stored = Number(l.assignedSeats) || 0;
        return (tracked > 0 || stored === 0) ? tracked : stored;
    }
    async function renderLicensesPage(el) {
        const [licenses, la] = await Promise.all([store.getAll('licenses'), store.getAll('licenseAssignments')]);
        const now = Date.now();
        el.innerHTML = `
        <div class="page-head"><h1>Licenses &amp; subscriptions</h1>
          <div class="actions">
            <button class="btn" onclick="openImportModal('licenses')">⬆️ Import</button>
            <button class="btn primary" onclick="openLicenseModal()">＋ New license</button>
          </div></div>
        <div class="toolbar"><input class="search" id="licSearch" placeholder="🔎 Search licenses…"></div>
        <div class="table-wrap panel"><table id="licTable" class="js-colfilter"><thead><tr>
          <th>Product</th><th>Vendor</th><th>Type</th><th class="right">Seats</th><th>Utilization</th><th class="right">Unit</th><th class="right">Est. / mo</th><th>Renews</th><th>Actions</th>
        </tr></thead><tbody>
        ${licenses.sort((a, b) => a.product.localeCompare(b.product)).map(l => {
            const t = Number(l.totalSeats) || 0, a = licenseAssigned(l, la), stored = Number(l.assignedSeats) || 0;
            const u = t ? Math.round(a / t * 100) : 0;
            const over = a > t && t > 0, renewSoon = l.renewalDate && new Date(l.renewalDate).getTime() <= now + 60 * 864e5;
            const barColor = over ? 'var(--bad)' : (u >= 90 ? 'var(--warn)' : 'var(--ok)');
            const drift = stored > 0 && stored !== a ? ` <small class="muted" title="Stored/M365-reported seat count differs from people tracked">(M365: ${stored})</small>` : '';
            return `<tr>
              <td><strong>${esc(l.product)}</strong></td><td>${esc(l.vendor)}</td><td>${esc(l.licenseType)}</td>
              <td class="right">${a} / ${t || '—'}${drift}</td>
              <td><div style="background:var(--panel2);border-radius:6px;height:8px;width:90px;overflow:hidden"><div style="height:8px;width:${Math.min(100, u)}%;background:${barColor}"></div></div><small class="muted">${u}%${over ? ' ⚠ over' : ''}</small></td>
              <td class="right">${money(l.unitCost)}</td><td class="right">${money(Math.round(licenseMonthlyCost(l, a)))}</td>
              <td>${l.renewalDate ? `<span class="badge ${renewSoon ? 'b-warn' : 'b-mut'}">${fmtDate(l.renewalDate)}</span>` : '—'}</td>
              <td><button class="btn sm" onclick="openLicenseModal('${esc(l._spItemId)}')">Edit</button></td></tr>`;
        }).join('')}
        </tbody></table></div>
        ${licenses.length ? `<p class="muted">Estimated total: <strong>${money(Math.round(licenses.reduce((s, l) => s + licenseMonthlyCost(l, licenseAssigned(l, la)), 0)))}/mo</strong> · ${money(Math.round(licenses.reduce((s, l) => s + licenseMonthlyCost(l, licenseAssigned(l, la)) * 12, 0)))}/yr (based on seats assigned to people).</p>` : '<div class="empty">No licenses yet. Add one, import a CSV, or run the O365 LicenseSync flow.</div>'}`;
        const table = document.getElementById('licTable'); enableColumnFilters(table, 'licenses');
        document.getElementById('licSearch').addEventListener('input', e => { table._searchTerm = e.target.value; applyTableFilters(table); });
    }
    async function openLicenseModal(spItemId) {
        const licenses = await store.getAll('licenses');
        const l = spItemId ? licenses.find(x => x._spItemId === spItemId) : null;
        const opt = (arr, sel) => arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
        openModal(`
        <div class="m-head"><h3>${l ? 'Edit' : 'New'} license</h3><button class="x" onclick="closeModal()">×</button></div>
        <div class="m-body"><div class="grid3">
          <div class="field"><label>Product *</label><input id="lc_product" value="${esc(l?.product || '')}" ${l ? 'readonly' : ''}></div>
          <div class="field"><label>Vendor</label><input id="lc_vendor" value="${esc(l?.vendor || '')}"></div>
          <div class="field"><label>Type</label><select id="lc_type"><option value=""></option>${opt(LICENSE_TYPES, l?.licenseType)}</select></div>
          <div class="field"><label>SKU part number</label><input id="lc_sku" value="${esc(l?.skuPartNumber || '')}" placeholder="e.g. SPE_E3"></div>

          <div class="field"><label>Renewal date</label><input type="date" id="lc_renew" value="${toDateInput(l?.renewalDate)}"></div>
          <div class="field"><label>Owner</label><input id="lc_owner" value="${esc(l?.owner || '')}"></div>
        </div><div class="field"><label>Notes</label><textarea id="lc_notes">${esc(l?.notes || '')}</textarea></div></div>
        <div class="m-foot">${l ? `<button class="btn danger" onclick="deleteLicense('${esc(l._spItemId)}')">Delete</button>` : ''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLicense('${l ? esc(l._spItemId) : ''}')">Save</button></div>`, true);
    }
    async function saveLicense(spItemId) {
        const g = id => document.getElementById(id).value.trim();
        const product = g('lc_product'); if (!product) { toast('Product is required.', 'bad'); return; }
        const obj = { product, vendor: g('lc_vendor'), licenseType: g('lc_type'), skuPartNumber: g('lc_sku'),
            totalSeats: g('lc_total') === '' ? '' : Number(g('lc_total')), assignedSeats: g('lc_assigned') === '' ? '' : Number(g('lc_assigned')),
            unitCost: g('lc_cost') === '' ? '' : Number(g('lc_cost')), billingCycle: g('lc_cycle'), renewalDate: fromDateInput(g('lc_renew')), owner: g('lc_owner'), notes: g('lc_notes') };
        try { if (spItemId) await store.update('licenses', spItemId, obj); else await store.add('licenses', obj); toast('License saved.', 'ok'); closeModal(); router(); }
        catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    async function deleteLicense(spItemId) {
        const [licenses, la] = await Promise.all([store.getAll('licenses'), store.getAll('licenseAssignments')]);
        const l = licenses.find(x => x._spItemId === spItemId); if (!l) return;
        const matches = la.filter(x => (l.skuPartNumber && x.skuPartNumber === l.skuPartNumber) || (l.product && x.product === l.product));
        const extra = matches.length ? `\n\nThis will also remove ${matches.length} per-person assignment record(s) for this license.` : '';
        if (!confirm(`Delete license "${l.product}"?${extra}`)) return;
        try {
            await store.remove('licenses', spItemId);
            for (const x of matches) await store.remove('licenseAssignments', x._spItemId);
            toast(`License deleted${matches.length ? ` + ${matches.length} assignment(s)` : ''}.`, 'ok'); closeModal(); router();
        } catch (e) { toast('Delete failed: ' + e.message, 'bad'); }
    }
    async function deleteLicenseAssignment(spItemId) {
        if (!confirm('Remove this license assignment? (Does not change the license catalog.)')) return;
        try { await store.remove('licenseAssignments', spItemId); toast('License assignment removed.', 'ok'); router(); }
        catch (e) { toast('Remove failed: ' + e.message, 'bad'); }
    }
    function _licenseCatalogKeys(licenses) {
        return { skus: new Set(licenses.filter(l => l.skuPartNumber).map(l => l.skuPartNumber)), prods: new Set(licenses.filter(l => l.product).map(l => l.product)) };
    }
    function _laIsOrphan(x, keys) {
        const skuOk = x.skuPartNumber && keys.skus.has(x.skuPartNumber);
        const prodOk = x.product && keys.prods.has(x.product);
        return !skuOk && !prodOk;
    }
    async function cleanOrphanLicenseAssignments() {
        const [la, licenses] = await Promise.all([store.getAll('licenseAssignments'), store.getAll('licenses')]);
        const keys = _licenseCatalogKeys(licenses);
        const orphans = la.filter(x => _laIsOrphan(x, keys));
        if (!orphans.length) { toast('No orphan license assignments.', 'ok'); return; }
        if (!confirm(`Remove ${orphans.length} license assignment(s) whose license no longer exists?`)) return;
        let n = 0; for (const x of orphans) { try { await store.remove('licenseAssignments', x._spItemId); n++; } catch (e) { } }
        toast(`Removed ${n} orphan license assignment(s).`, 'ok'); router();
    }

    /* -------------------------------------------------------------------- People */
    function personKeyOf(name, upn) { return (upn || name || '').toLowerCase(); }

        const touch = (name, upn) => { const k = personKeyOf(name, upn); if (!k) return null; if (!people[k]) people[k] = { name: name || upn, upn: upn || '', held: 0, licenses: 0 }; if (name && !people[k].name) people[k].name = name; if (upn && !people[k].upn) people[k].upn = upn; return people[k]; };

        ${list.map(p => `<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.upn)}</td><td class="right">${p.held}</td><td class="right">${p.licenses}</td><td><a class="btn sm" href="#/person/${encodeURIComponent(p.upn || p.name)}">View / offboard</a></td></tr>`).join('')}
        </tbody></table></div>
        ${list.length ? '' : '<div class="empty">No one is currently holding assets. Check out an asset to a person to populate this.</div>'}`;
        const table = document.getElementById('pplTable');
        document.getElementById('pplSearch').addEventListener('input', e => { const v = e.target.value.toLowerCase(); [...table.tBodies[0].rows].forEach(r => { r.style.display = r.textContent.toLowerCase().includes(v) ? '' : 'none'; }); });

    async function viewPersonDetails(el, key) {
        const [assignments, assets, lic, catalog] = await Promise.all([store.getAll('assignments'), store.getAll('assets'), store.getAll('licenseAssignments'), store.getAll('licenses')]);
        const k = decodeURIComponent(key).toLowerCase();
        const match = x => personKeyOf(x.personName, x.personUpn) === k;

        const openHeld = mine.filter(a => !a.returnedDate);

        const myLicMonthly = myLic.reduce((s, a) => s + skuCost(a.skuPartNumber), 0);
        const _pKeys = _licenseCatalogKeys(catalog);
        const person = mine[0] || myLic[0] || { personName: decodeURIComponent(key), personUpn: '' };
        const name = person.personName || person.personUpn;
        const assetByTag = t => assets.find(a => a.assetTag === t);
        el.innerHTML = `
        <div class="page-head"><h1>👤 ${esc(name)}</h1></div>
        <a href="#/people" class="muted">← All people</a>
        <div class="tiles" style="margin-top:12px">
          <div class="tile"><div class="k">Hardware held</div><div class="v">${openHeld.length}</div><div class="sub">to return on offboarding</div></div>

        </div>
        <div class="panel"><h2>💻 Currently held hardware (offboarding checklist)</h2><div class="body">${openHeld.length ? `<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Category</th><th>Model</th><th>Since</th><th>Action</th></tr></thead><tbody>${openHeld.map(a => { const as = assetByTag(a.assetTag); return `<tr><td><a href="#/asset/${encodeURIComponent(a.assetTag)}">${esc(a.assetTag)}</a></td><td>${esc(as?.category || '')}</td><td>${esc(as?.model || '')}</td><td>${fmtDate(a.issuedDate)}</td><td>${as ? `<button class="btn sm" onclick="checkInAsset('${esc(a.assetTag)}')">Check in</button>` : '<span class="muted">asset missing</span>'}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No hardware currently held. ✓</div>'}</div></div>
        <div class="panel"><h2>🔑 Assigned licenses</h2><div class="body">${myLic.length ? `<div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Assigned</th><th>Actions</th></tr></thead><tbody>${myLic.map(a => { const orphan = _laIsOrphan(a, _pKeys); return `<tr><td>${esc(a.product)}${orphan ? ' <span class="badge b-bad">license removed</span>' : ''}</td><td>${esc(a.skuPartNumber)}</td><td>${fmtDate(a.assignedDate)}</td><td class="nowrap"><button class="btn sm danger" onclick="deleteLicenseAssignment('${esc(a._spItemId)}')">Remove</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No licenses recorded for this person. (Run the O365 LicenseSync flow to auto-populate.)</div>'}</div></div>
        <div class="panel"><h2>🔄 Full custody history</h2><div class="body">${mine.length ? `<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Issued</th><th>Returned</th></tr></thead><tbody>${mine.sort((p, q) => new Date(q.issuedDate) - new Date(p.issuedDate)).map(a => `<tr><td><a href="#/asset/${encodeURIComponent(a.assetTag)}">${esc(a.assetTag)}</a></td><td>${fmtDate(a.issuedDate)}</td><td>${a.returnedDate ? fmtDate(a.returnedDate) : '<span class="badge b-ok">Out now</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No custody records.</div>'}</div></div>`;
    }

    /* -------------------------------------------------------------------- Health */
    async function renderHealthPage(el) {
        const [assets, assignments, locations, licenseAssignments, licenses] = await Promise.all([store.getAll('assets'), store.getAll('assignments'), store.getAll('locations'), store.getAll('licenseAssignments'), store.getAll('licenses')]);
        const _licKeys = _licenseCatalogKeys(licenses);
        const orphanLic = licenseAssignments.filter(x => _laIsOrphan(x, _licKeys));
        const licSeatMismatch = licenses.filter(l => { const tracked = licenseTracked(l, licenseAssignments); const stored = Number(l.assignedSeats) || 0; return stored > 0 && tracked > 0 && stored !== tracked; });
        // duplicates
        const bySerial = {}, byTag = {};
        assets.forEach(a => { if (a.serialNumber) (bySerial[a.serialNumber] = bySerial[a.serialNumber] || []).push(a); (byTag[a.assetTag] = byTag[a.assetTag] || []).push(a); });
        const dupSerial = Object.entries(bySerial).filter(([, v]) => v.length > 1);
        const dupTag = Object.entries(byTag).filter(([, v]) => v.length > 1);
        // orphans: assignment or asset location referencing something missing
        const tagSet = new Set(assets.map(a => a.assetTag));
        const orphanAssign = assignments.filter(x => x.assetTag && !tagSet.has(x.assetTag));
        const locSet = new Set(locations.map(l => l.locId));
        const badLoc = assets.filter(a => a.locationId && !locSet.has(a.locationId));
        // completeness
        const deployedNoOwner = assets.filter(a => a.status === 'Deployed' && !a.assignedToName);
        const noSerial = assets.filter(a => !a.serialNumber && !['Peripheral', 'Other'].includes(a.category));
        const noCost = assets.filter(a => !a.purchaseCost && !['Retired', 'Disposed', 'Lost'].includes(a.status));
        // stale-out: deployed with no open assignment
        const openByTag = new Set(assignments.filter(x => !x.returnedDate).map(x => x.assetTag));
        const deployedNoOpen = assets.filter(a => a.status === 'Deployed' && !openByTag.has(a.assetTag));

        const section = (title, kind, items, render) => `<div class="panel"><h2>${title} <span class="badge ${items.length ? kind : 'b-ok'}">${items.length}</span></h2><div class="body">${items.length ? render() : '<div class="empty">None. ✓</div>'}</div></div>`;
        const link = t => `<a href="#/asset/${encodeURIComponent(t)}">${esc(t)}</a>`;
        el.innerHTML = `
        <div class="page-head"><h1>Inventory Health</h1><button class="btn" onclick="store.clear();router()">↻ Re-check</button></div>
        <h3 class="muted">Integrity</h3>
        ${section('Duplicate serial numbers', 'b-bad', dupSerial, () => dupSerial.map(([s, v]) => `<div>Serial <strong>${esc(s)}</strong>: ${v.map(a => link(a.assetTag)).join(', ')}</div>`).join(''))}
        ${section('Duplicate asset tags', 'b-bad', dupTag, () => dupTag.map(([t, v]) => `<div>Tag <strong>${esc(t)}</strong> appears ${v.length}×</div>`).join(''))}
        ${section('Assignments for missing assets', 'b-bad', orphanAssign, () => `${orphanAssign.length > 1 ? `<p><button class="btn sm danger" onclick="cleanOrphanAssignments()">🧹 Remove all ${orphanAssign.length}</button></p>` : ''}` + orphanAssign.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0"><span>${esc(x.assetTag)} → ${esc(x.personName)} <span class="muted">(asset not found)</span></span><button class="btn sm danger" onclick="deleteAssignment('${esc(x._spItemId)}')">Remove</button></div>`).join(''))}
        ${section('Assets in an unknown location', 'b-warn', badLoc, () => badLoc.map(a => `<div>${link(a.assetTag)} → location “${esc(a.locationId)}” not in Locations</div>`).join(''))}
        ${section('License assignments for removed licenses', 'b-bad', orphanLic, () => `${orphanLic.length > 1 ? `<p><button class="btn sm danger" onclick="cleanOrphanLicenseAssignments()">🧹 Remove all ${orphanLic.length}</button></p>` : ''}` + orphanLic.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0"><span>${esc(x.personName || x.personUpn)} → ${esc(x.product || x.skuPartNumber)} <span class="muted">(license no longer exists)</span></span><button class="btn sm danger" onclick="deleteLicenseAssignment('${esc(x._spItemId)}')">Remove</button></div>`).join(''))}
        ${section('License seat count mismatch (stored vs people tracked)', 'b-warn', licSeatMismatch, () => licSeatMismatch.map(l => `<div><a href="#/licenses">${esc(l.product)}</a> — stored “Assigned seats” = ${Number(l.assignedSeats)}, but ${licenseTracked(l, licenseAssignments)} people are tracked as holding it</div>`).join(''))}
        ${section('Deployed but no open custody record', 'b-warn', deployedNoOpen, () => deployedNoOpen.map(a => `<div>${link(a.assetTag)} — status Deployed, no open assignment</div>`).join(''))}
        <h3 class="muted">Completeness</h3>
        ${section('Deployed with no assignee', 'b-warn', deployedNoOwner, () => deployedNoOwner.map(a => `<div>${link(a.assetTag)}</div>`).join(''))}
        ${section('Missing serial number', 'b-warn', noSerial, () => noSerial.map(a => `<div>${link(a.assetTag)} (${esc(a.category)})</div>`).join(''))}
        ${section('Missing purchase cost', 'b-mut', noCost, () => noCost.map(a => `<div>${link(a.assetTag)}</div>`).join(''))}`;

    /* ------------------------------------------------------------------- QR label */
    function loadQrLib() {
        if (window.QRCode) return Promise.resolve();
        return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    }
    async function printAssetQr(assetTag) {
        await loadQrLib();
        const url = CONFIG.pagesUrl + '#/asset/' + encodeURIComponent(assetTag);
        const holder = document.createElement('div');
        new QRCode(holder, { text: url, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
        setTimeout(() => {
            const img = holder.querySelector('img') || holder.querySelector('canvas');
            const src = img.tagName === 'IMG' ? img.src : img.toDataURL();
            const w = window.open('', '_blank', 'width=420,height=520');
            w.document.write(`<html><head><title>${esc(assetTag)}</title><style>body{font-family:sans-serif;text-align:center;padding:24px}h2{margin:8px 0}</style></head><body><img src="${src}" style="width:280px;height:280px"><h2>${esc(assetTag)}</h2><div>Scan to open this asset</div><script>window.onload=()=>window.print()<\/script></body></html>`);
            w.document.close();
        }, 250);
    }

    /* --------------------------------------------------------------- CSV import/export */
    // Per-entity import specs: canonical headers, field aliases, defaults, dedup key.
    const IMPORT_SPECS = {
        assets: { entity: 'assets', title: 'Assets', goto: '#/assets',
            fields: [ ['AssetTag','assetTag'],['SerialNumber','serialNumber'],['Category','category'],['Make','make'],['Model','model'],['Status','status'],['Condition','condition'],['ExpectReturn','expectReturn'],['LocationId','locationId'],['PONumber','poNumber'],['Vendor','vendor'],['PurchaseDate','purchaseDate','date'],['PurchaseCost','purchaseCost','num'],['DepreciationYears','depreciationYears','num'],['SalvageValue','salvageValue','num'],['WarrantyExpiration','warrantyExpiration','date'],['Notes','notes'] ],
            aliases: { serial: 'serialNumber', location: 'locationId', po: 'poNumber', cost: 'purchaseCost', warranty: 'warrantyExpiration' },
            defaults: { status: 'In Stock' }, dedup: o => String(o.assetTag) },
        locations: { entity: 'locations', title: 'Locations', goto: '#/locations',
            fields: [ ['LocationId','locId'],['LocType','locType'],['Address','address'],['Notes','notes'] ],
            aliases: { location: 'locId', name: 'locId', type: 'locType' }, defaults: {}, dedup: o => String(o.locId) },
        spares: { entity: 'sparing', title: 'Sparing targets', goto: '#/spares',
            fields: [ ['Category','category'],['Model','model'],['MinQty','minQty','num'],['TargetQty','targetQty','num'],['Notes','notes'] ],
            aliases: { min: 'minQty', target: 'targetQty' }, defaults: {}, dedup: o => o.model ? `${o.category}|${o.model}` : String(o.category),
            finalize: o => { o.key = o.model ? `${o.category}|${o.model}` : o.category; return o; } },
        licenses: { entity: 'licenses', title: 'Licenses', goto: '#/licenses',
            fields: [ ['Product','product'],['Vendor','vendor'],['LicenseType','licenseType'],['SkuPartNumber','skuPartNumber'],['TotalSeats','totalSeats','num'],['AssignedSeats','assignedSeats','num'],['UnitCost','unitCost','num'],['BillingCycle','billingCycle'],['RenewalDate','renewalDate','date'],['Owner','owner'],['Notes','notes'] ],
            aliases: { productname: 'product', sku: 'skuPartNumber', seats: 'totalSeats', cost: 'unitCost', cycle: 'billingCycle', renewal: 'renewalDate' }, defaults: {}, dedup: o => String(o.product) }
    };
    const _impNorm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
    function _impColmap(spec) {
        const m = {}; const byField = {};
        spec.fields.forEach(f => { m[_impNorm(f[0])] = f; m[_impNorm(f[1])] = f; byField[f[1]] = f; });
        Object.entries(spec.aliases || {}).forEach(([a, field]) => { if (byField[field]) m[_impNorm(a)] = byField[field]; });
        return m;
    }
    function _impCoerce(v, t) { if (t === 'num') return v === '' || v == null ? '' : Number(v); if (t === 'date') return v ? fromDateInput(toDateInput(v)) : ''; return v == null ? '' : String(v).trim(); }
    let _importRows = [], _importSpecKey = 'assets';
    function openImportModal(specKey) {
        _importSpecKey = specKey && IMPORT_SPECS[specKey] ? specKey : 'assets';
        const spec = IMPORT_SPECS[_importSpecKey];
        const key = spec.fields[0][0];
        openModal(`
        <div class="m-head"><h3>Import ${esc(spec.title)} (CSV / Excel)</h3><button class="x" onclick="closeModal()">×</button></div>
        <div class="m-body">
          <p class="muted">Header row must include <strong>${esc(key)}</strong> (required). Recognized columns: ${spec.fields.map(f => esc(f[0])).join(', ')}. Existing records (matched on ${esc(key)}) are skipped — never overwritten.</p>
          <p><button class="btn sm" onclick="downloadImportTemplate('${_importSpecKey}')">⬇️ Download blank template</button></p>
          <input type="file" id="imp_file" accept=".csv,.xlsx,.xls">
          <div id="imp_preview" style="margin-top:12px"></div>
        </div>
        <div class="m-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="imp_go" disabled onclick="runImport()">Import</button></div>`, true);
        document.getElementById('imp_file').addEventListener('change', previewImport);
    }
    function downloadImportTemplate(specKey) {
        const spec = IMPORT_SPECS[specKey]; const headers = spec.fields.map(f => f[0]);
        const ws = XLSX.utils.aoa_to_sheet([headers]);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, spec.title);
        XLSX.writeFile(wb, `itinventory-template-${specKey}.csv`);
    }
    function previewImport(e) {
        const file = e.target.files[0]; if (!file) return;
        const spec = IMPORT_SPECS[_importSpecKey], colmap = _impColmap(spec), keyField = spec.fields[0][1];
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const wb = XLSX.read(ev.target.result, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
                _importRows = rows.map(r => {
                    const o = Object.assign({}, spec.defaults);
                    Object.entries(r).forEach(([k, v]) => { const f = colmap[_impNorm(k)]; if (f) o[f[1]] = _impCoerce(v, f[2]); });
                    return o;
                }).filter(o => o[keyField] !== '' && o[keyField] != null);
                document.getElementById('imp_preview').innerHTML = `<strong>${_importRows.length}</strong> rows detected.` + (_importRows.length ? ` First: ${esc(_importRows[0][keyField])}` : '');
                document.getElementById('imp_go').disabled = !_importRows.length;
            } catch (err) { document.getElementById('imp_preview').innerHTML = `<span style="color:var(--bad)">Parse error: ${esc(err.message)}</span>`; }
        };
        reader.readAsBinaryString(file);
    }
    async function runImport() {
        const spec = IMPORT_SPECS[_importSpecKey];
        const existing = new Set((await store.getAll(spec.entity)).map(spec.dedup));
        let added = 0, skipped = 0, failed = 0;
        document.getElementById('imp_go').disabled = true;
        for (const r of _importRows) {
            const dk = spec.dedup(r);
            if (existing.has(dk)) { skipped++; continue; }
            const obj = spec.finalize ? spec.finalize(r) : r;
            try { await store.add(spec.entity, obj); added++; existing.add(dk); } catch (e) { failed++; }
            document.getElementById('imp_preview').innerHTML = `Importing… ${added} added, ${skipped} skipped${failed ? ', ' + failed + ' failed' : ''}`;
        }
        toast(`Import done: ${added} added, ${skipped} skipped${failed ? ', ' + failed + ' failed' : ''}.`, failed ? 'bad' : 'ok');
        closeModal(); go(spec.goto); router();
    }
    async function exportAssetsCsv() {
        const assets = await store.getAll('assets');
        const cols = ['assetTag', 'serialNumber', 'category', 'make', 'model', 'status', 'condition', 'expectReturn', 'assignedToName', 'assignedToUpn', 'locationId', 'poNumber', 'vendor', 'purchaseDate', 'purchaseCost', 'depreciationYears', 'salvageValue', 'warrantyExpiration', 'notes'];
        const data = assets.map(a => { const o = {}; cols.forEach(c => o[c] = a[c]); return o; });
        const ws = XLSX.utils.json_to_sheet(data, { header: cols });
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Assets');
        XLSX.writeFile(wb, 'it-assets-export.csv');
    }
    </script>
</body>
